<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zhongwen Explorer — News</title>
  <style>
    /* An author `display` rule outranks the UA's [hidden] rule, so anything
       toggled with .hidden needs this or it never actually hides. */
    [hidden] { display: none !important; }
    :root { color-scheme: light; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 680px; margin: 28px auto; padding: 0 16px; color: #222;
      font-size: 15px;
    }
    h1 { font-size: 20px; margin-bottom: 2px; }
    .nav { display: flex; gap: 14px; align-items: center; margin: 4px 0 10px; }
    .nav a { color: #b5232b; font-weight: 600; text-decoration: none; }
    .nav a:hover { text-decoration: underline; }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
    .status { color: #777; font-size: 13px; }
    .difficulty-label { display: flex; align-items: center; gap: 5px;
      color: #555; font-size: 13px; }
    .difficulty-label select { font: inherit; font-size: 13px; padding: 5px 7px;
      border-radius: 7px; border: 1px solid #ccc; background: #fafafa; cursor: pointer; }
    button {
      font-size: 13px; padding: 7px 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid #ccc; background: #fafafa;
    }
    button:hover:not(:disabled) { background: #f0f0f0; }
    button:disabled { opacity: 0.6; cursor: default; }
    .primary { border-color: #b5232b; background: #b5232b; color: #fff; font-weight: 600; }
    .primary:hover:not(:disabled) { background: #9c1e25; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip { padding: 2px 10px; border-radius: 12px; background: #f1ead9; color: #8a7a58;
      font-size: 12px; font-weight: 600; }
    .chip.level { background: #fdf6c7; color: #7f1920; }
    .headline { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 2px; }
    .headline h2 { margin: 0; font-size: 26px; line-height: 1.3;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .title-pinyin { color: #999; font-size: 14px; margin-bottom: 16px; }
    .speak { flex: none; width: 30px; height: 30px; padding: 0; border-radius: 50%;
      font-size: 14px; line-height: 1; }
    .article {
      border: 1px solid #ddd; border-radius: 12px; padding: 22px 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05); margin-bottom: 16px;
    }
    .article p { margin: 0 0 14px; font-size: 22px; line-height: 1.85;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
    .article p:last-child { margin-bottom: 0; }
    .section { margin-bottom: 16px; }
    .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .section-head h3 { margin: 0; font-size: 13px; text-transform: uppercase;
      letter-spacing: 0.06em; color: #8a7a58; }
    .gloss-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px;
      align-items: baseline; padding: 6px 0; border-top: 1px dashed #eee; }
    .gloss-row:first-child { border-top: 0; }
    .gloss-word { font-size: 18px; font-weight: 600; color: #8f1c23;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    .gloss-pinyin { color: #777; font-size: 13px; }
    .gloss-meaning { grid-column: 1 / 3; color: #444; font-size: 14px; }
    .gloss-row .speak { width: 24px; height: 24px; font-size: 12px; grid-row: 1 / 3; align-self: center; }
    .summary-box { border: 1px solid #e2dccb; border-radius: 10px; background: #fffef8;
      padding: 12px 14px; color: #444; font-size: 14px; line-height: 1.5; margin-top: 8px; }
    .sources { font-size: 12.5px; color: #888; }
    .sources a { color: #7a6f52; }
    .sources li { margin-bottom: 3px; }
    .empty, .setup { color: #666; margin-top: 30px; text-align: center; }
    .setup p, .empty p { max-width: 480px; margin: 0 auto 14px; }

    /* Hover-to-define popup (shared machinery in lib/lookup.js). */
    .tone1 { color: #d02c1f; } .tone2 { color: #0f8b1f; }
    .tone3 { color: #1b3ddb; } .tone4 { color: #8615bd; } .tone5 { color: #767676; }
    body.embedded { margin-top: 18px; margin-bottom: 40px; }
    body.embedded > h1, body.embedded > .nav { display: none; }
  </style>
</head>
<body>
  <h1>News</h1>
  <div class="nav">
    <a href="review.html">Review</a>
    <a href="wordlist.html">Saved library</a>
    <a href="hsk.html">HSK guides</a>
    <a href="practice.html">Pronunciation</a>
    <a href="options.html">Options</a>
  </div>
  <div class="toolbar">
    <button id="generate" class="primary" type="button" hidden>Generate today's news</button>
    <button id="regenerate" type="button" hidden>↻ Regenerate</button>
    <label class="difficulty-label" id="difficultyLabel" hidden>Difficulty
      <select id="difficulty">
        <option value="easier">Easier</option>
        <option value="normal">Just right</option>
        <option value="harder">Harder</option>
      </select>
    </label>
    <button id="english" type="button" hidden>Show English</button>
    <span class="status" id="status"></span>
  </div>
  <div id="app"></div>
  <!-- The universal popup is a classic script (shared verbatim with the
       content script), so it must load before the page module. -->
  <script src="lib/popup.js"></script>
  <script src="lib/savecard.js"></script>
  <script type="module" src="news.js"></script>
</body>
</html>
