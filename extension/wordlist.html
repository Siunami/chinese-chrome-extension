<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Zhongwen Explorer — Saved Library</title>
  <link rel="stylesheet" href="shell.css">
  <style>
    :root { --zx-measure: 1040px; }
    body.zx-app { font-size: 14px; }
    .toolbar { margin: 12px 0 20px; display: flex; gap: 10px; align-items: center; }

    /* The table used to size itself: every column but Definition was nowrap,
       so with `table-layout: auto` they each claimed their widest row and the
       table grew past the page, spilling Next and the delete button onto the
       background while Definition was crushed to three words a line. Fixed
       layout means these widths are the whole story, and Definition — the one
       column that genuinely wants the slack — absorbs the remainder. */
    #list { overflow-x: auto; } /* narrow windows scroll the table, not the page */
    /* min-width is the floor that keeps this readable. Every column is sized,
       so under `table-layout: fixed` they shrink *proportionally* when the
       table is narrower than their sum — no single column can be squeezed to
       nothing. Leaving Definition unsized did exactly that: at 880px the
       percentages and pixel columns ate the whole table and it collapsed to a
       few pixels, stacking the header one letter per line. */
    table { border-collapse: collapse; width: 100%; min-width: 860px; table-layout: fixed; }
    th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #e4e4e4;
      vertical-align: top; }
    td { overflow-wrap: anywhere; } /* headers must never break mid-word */
    th { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #888; }
    th:nth-child(1) { width: 21%; }  /* Card */
    th:nth-child(2) { width: 8%; }   /* Trad. */
    th:nth-child(3) { width: 14%; }  /* Pinyin */
    th:nth-child(4) { width: 20%; }  /* Definition */
    th:nth-child(5) { width: 88px; } /* Saved */
    th:nth-child(6) { width: 182px; }/* Progress: fits "· 1 rep · ease 2.50" */
    th:nth-child(7) { width: 88px; } /* Next */
    th:nth-child(8) { width: 38px; } /* remove */

    td.hanzi { font-size: 18px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
    tr.sentence-card td.hanzi { font-size: 16px; line-height: 1.55; }
    tr.sentence-card td.pinyin { line-height: 1.45; }
    /* Headword, badge and speaker on one baseline — the button used to drop to
       its own line as soon as the text filled the column. */
    .card-cell { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; }
    .type-badge { padding: 1px 5px;
      border-radius: 8px; background: #eef4ff; color: #416895; font: 700 9px/1.5
      -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; }
    .speak { padding: 2px 5px; border: 0; border-radius: 50%;
      background: transparent; font-size: 12px; opacity: 0.58; }
    .speak:hover { background: #eef4ff; opacity: 1; }
    td.pinyin { color: #444; }
    td.meta { color: #777; font-size: 12.5px; }
    td.meta .touches { color: #aaa; }
    td.status { font-size: 12.5px; }
    .st-new { color: #1a6fd4; font-weight: 600; }
    .st-due { color: #b5232b; font-weight: 600; }
    .st-later { color: #0a7a2f; }
    td.del button { padding: 1px 6px; border: 0; background: none; color: #a33;
      font-size: 13px; line-height: 1.4; cursor: pointer; border-radius: 6px; }
    td.del button:hover { background: #fbe4e4; }
    .empty { color: #888; margin-top: 24px; }
    .count { color: #888; font-size: 13px; margin-left: auto; }

    /* Collection overview: the curve, and what is coming back when. */
    #overview { border: 1px solid #e6e0d2; border-radius: 12px;
      padding: 16px 18px; background: #fffdf7; margin-bottom: 16px; }
    #overview:empty { display: none; }
    .overview-line { font-size: 13px; color: #666; margin-bottom: 14px; }
    .overview-line b { color: #222; font-variant-numeric: tabular-nums; }
    .overview-grid { display: grid; grid-template-columns: minmax(210px, 1fr) 1.6fr;
      gap: 22px; align-items: start; }
    @media (max-width: 720px) { .overview-grid { grid-template-columns: 1fr; } }

    /* Filter chips + sort. */
    #filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
      margin-bottom: 10px; }
    #filters:empty { display: none; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
      border: 1px solid #e0d9c9; border-radius: 20px; background: #fff;
      font-size: 12px; color: #555; cursor: pointer; }
    .chip:hover { background: #faf7ee; }
    .chip.on { border-color: #d8cab5; background: #fdf6c7; color: #7f1920;
      font-weight: 650; }
    .chip-dot { width: 8px; height: 8px; border-radius: 2px; }
    .chip-n { color: #999; font-variant-numeric: tabular-nums; }
    .chip.on .chip-n { color: #a0733a; }
    .sort { display: inline-flex; align-items: center; gap: 6px; margin-left: auto;
      font-size: 12px; color: #888; }
    .sort select { font-size: 12px; padding: 3px 5px; }

    /* Per-card schedule. */
    .sched-top { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .stage-chip { font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
      text-transform: uppercase; padding: 1px 6px; border-radius: 9px;
      background: #f1f1f1; color: #666; }
    .stage-chip.stage-new { background: #eaf2fd; color: #2f6099; }
    .stage-chip.stage-learning { background: #e7f0fc; color: #1f5fb0; }
    .stage-chip.stage-young { background: #e2ecfa; color: #1d5399; }
    .stage-chip.stage-mature { background: #dde7f6; color: #123a6d; }
    .sched-detail { color: #999; font-size: 11.5px; margin-top: 3px;
      font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="zx-app">
  <main class="zx-content">
  <h2 class="zx-title">Saved library</h2>
  <div class="toolbar">
    <button id="export">Export TSV (Anki / Pleco)</button>
    <button id="clear">Clear all</button>
    <span class="count" id="count"></span>
  </div>
  <div id="overview"></div>
  <div id="filters"></div>
  <div id="list"></div>
  </main>
  <!-- The universal popup is a classic script (shared verbatim with the
       content script), so it must load before the page module. -->
  <script src="lib/popup.js"></script>
  <script src="lib/savecard.js"></script>
  <script type="module" src="wordlist.js"></script>
</body>
</html>
