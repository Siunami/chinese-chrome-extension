<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B5232B">
  <title>Zhongwen Flashcards</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon192.png">
  <link rel="apple-touch-icon" href="icons/icon180.png">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; background: #faf8f2; color: #222; font-size: 15px; line-height: 1.5;
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      background: #B5232B; color: #fff; display: flex; align-items: center;
      gap: 8px; padding: 10px 14px;
      padding-top: calc(10px + env(safe-area-inset-top));
      position: sticky; top: 0; z-index: 10;
    }
    header h1 { font-size: 16px; margin: 0; flex: 1; font-weight: 600; }
    #dueBadge {
      background: #fff; color: #B5232B; border-radius: 999px; font-size: 12.5px;
      font-weight: 700; padding: 1px 8px;
    }
    nav { display: flex; background: #fff; border-bottom: 1px solid #e5e0d5;
      position: sticky; top: calc(41px + env(safe-area-inset-top)); z-index: 9; }
    nav button {
      flex: 1; border: 0; background: none; padding: 11px 0; font-size: 14px;
      color: #777; border-bottom: 2px solid transparent; cursor: pointer;
    }
    nav button.active { color: #B5232B; border-bottom-color: #B5232B; font-weight: 600; }
    main { padding: 18px 14px 40px; max-width: 560px; margin: 0 auto; }

    /* review */
    .card { background: #fff; border: 1px solid #e5e0d5; border-radius: 14px;
      padding: 26px 16px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    .card-type { font-size: 11px; letter-spacing: .5px; text-transform: uppercase;
      color: #a58a2d; margin-bottom: 8px; }
    .hanzi { font-size: 52px; line-height: 1.25;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .hanzi.sentence { font-size: 26px; }
    .trad { font-size: 22px; color: #666; margin-top: 4px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .answer { margin-top: 16px; border-top: 1px dashed #ddd; padding-top: 16px; }
    .answer-line { display: flex; align-items: center; justify-content: center; gap: 8px; }
    .pinyin { font-size: 20px; }
    .tone1 { color: #d02c1f; } .tone2 { color: #0f8b1f; }
    .tone3 { color: #1b3ddb; } .tone4 { color: #8615bd; }
    .tone0, .tone5 { color: #767676; }
    .defs { font-size: 16px; color: #333; margin-top: 8px; }
    .speak { width: 34px; height: 34px; padding: 0; border-radius: 50%;
      font-size: 15px; line-height: 1; border: 1px solid #ccc; background: #fafafa; }
    .controls { margin-top: 20px; display: flex; gap: 8px; justify-content: center; }
    button { font-size: 14px; border-radius: 8px; cursor: pointer;
      border: 1px solid #ccc; background: #fafafa; padding: 10px 14px; }
    button.reveal { font-weight: 600; padding: 12px 34px; font-size: 15px; }
    button.primary { background: #B5232B; border-color: #B5232B; color: #fff; font-weight: 600; }
    button.danger { border-color: #d88; color: #b5232b; }
    .grade { flex: 1; max-width: 96px; display: flex; flex-direction: column;
      gap: 2px; align-items: center; padding: 9px 4px; }
    .grade small { font-weight: 400; color: #888; font-size: 11px; }
    .g-again { border-color: #d88; } .g-hard { border-color: #d8b169; }
    .g-good { border-color: #7fb98a; } .g-easy { border-color: #7fa3d8; }
    .empty { color: #888; margin-top: 30px; text-align: center; }
    .progress { height: 5px; border-radius: 3px; background: #ece8dc; overflow: hidden;
      margin-top: 14px; }
    .progress i { display: block; height: 100%; border-radius: 3px; background: #B5232B;
      transition: width 0.2s; }
    .queue-count { text-align: center; color: #aaa; font-size: 12px; margin-top: 6px; }

    /* end-of-session summary */
    .summary { background: #fff; border: 1px solid #e5e0d5; border-radius: 14px;
      padding: 18px 16px; }
    .summary-head { font-size: 18px; font-weight: 700; color: #0a7a2f; }
    .summary-sub { margin: 6px 0 0; color: #555; font-size: 13.5px; }
    .tiles { display: flex; gap: 8px; margin: 14px 0 4px; }
    .tile { flex: 1; border: 1px solid #eee8db; border-radius: 10px; padding: 8px 10px; }
    .tile-n { font-size: 20px; font-weight: 700; line-height: 1.1;
      font-variant-numeric: tabular-nums; }
    .tile-l { font-size: 11px; color: #888; }
    .held-row { margin: 14px 0 0; font-size: 13px; color: #555; line-height: 1.6; }
    .more-btn { margin-left: 8px; padding: 5px 12px; font-size: 12.5px;
      border-radius: 8px; border: 1px solid #d8cab5; background: #fdf6c7;
      color: #7f1920; font-weight: 650; }
    .next-up { margin: 14px 0 0; font-size: 13px; color: #555; }
    .next-up b { color: #222; }
    .summary .viz { margin-top: 20px; }

    /* word list */
    .search { width: 100%; padding: 9px 12px; font-size: 15px; border: 1px solid #ddd;
      border-radius: 9px; margin-bottom: 10px; background: #fff; }
    .count { color: #888; font-size: 12.5px; margin: 4px 2px 10px; }
    .word-row { display: flex; align-items: center; gap: 10px; background: #fff;
      border: 1px solid #eee8db; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
    .word-main { flex: 1; min-width: 0; }
    .word-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .word-head .hanzi { font-size: 22px; }
    .word-head .trad { font-size: 15px; margin: 0; }
    .word-head .pinyin { font-size: 14px; }
    .word-defs { font-size: 13px; color: #555; overflow: hidden; text-overflow: ellipsis;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .word-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
    .status { font-size: 11.5px; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
    .st-new { background: #fdf3e0; color: #9a6b00; }
    .st-due { background: #fdeaea; color: #b5232b; }
    .st-later { background: #e9f6ec; color: #0a7a2f; }
    .del { border: 0; background: none; color: #bbb; font-size: 14px; padding: 2px 6px; }

    /* tap-to-define */
    .tap-char { border-radius: 4px; }
    .tap-char:active { background: #f3eee3; }
    .word-main.tappable { cursor: pointer; }
    .example { margin-top: 14px; font-size: 15px; color: #444; }
    .ex-zh { font-size: 18px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .ex-zh .hl { color: #b5232b; font-weight: 700; }
    .ex-py { font-size: 12.5px; color: #999; }
    .ex-en { font-size: 13.5px; color: #666; }
    .ex-speak { width: 26px; height: 26px; margin-left: 5px; font-size: 12px; }

    /* word-detail bottom sheet */
    .sheet-overlay { position: fixed; inset: 0; z-index: 50; display: none;
      background: rgba(30, 24, 12, 0.4); }
    .sheet-overlay.open { display: flex; align-items: flex-end; }
    .sheet { width: 100%; max-height: 82vh; display: flex; flex-direction: column;
      background: #fffdf7; border-radius: 16px 16px 0 0;
      box-shadow: 0 -6px 24px rgba(36, 28, 14, 0.25);
      padding-bottom: env(safe-area-inset-bottom); }
    .sheet-bar { display: flex; align-items: center; padding: 8px 12px 4px; }
    .sheet-grab { flex: 1; height: 4px; max-width: 44px; margin: 0 auto;
      border-radius: 999px; background: #ddd5c4; }
    .sheet-back { border: 0; background: none; color: #b5232b; font-size: 14px;
      font-weight: 600; padding: 4px 8px; }
    .sheet-back.hidden { visibility: hidden; }
    .sheet-close { border: 0; background: none; color: #999; font-size: 16px;
      padding: 4px 10px; }
    .sheet-body { overflow-y: auto; padding: 4px 16px 22px; text-align: left;
      font-size: 14px; line-height: 1.4; -webkit-overflow-scrolling: touch; }
    .sheet-loading { color: #888; text-align: center; padding: 18px 0; }
    .sheet-entry + .sheet-entry { margin-top: 8px; padding-top: 8px;
      border-top: 1px dashed #e8e1d5; }
    .sheet-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px; }
    .sheet-word { color: #8f1c23; font-size: 26px; font-weight: 700;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .sheet-word.alt { font-size: 19px; opacity: 0.65; }
    .sheet-pinyin { color: #555; font-size: 15px; font-weight: 600; }
    .sheet-defs { margin-top: 3px; color: #3f3f3f; }
    .sheet-sense { display: flex; gap: 7px; align-items: baseline; padding: 2px 0; }
    .sheet-sense-num { flex: none; min-width: 15px; color: #a4834f; font-size: 11px;
      font-weight: 700; text-align: right; }
    .sheet-body button { padding: 3px 9px; border-radius: 7px; font-size: 12px; }
    .sheet-body button.saved { border-color: #83b790; color: #0a7a2f; }
    .sheet-speak { width: 26px; height: 26px; padding: 0; border-radius: 50%; }
    .sheet-section { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e8e1d5; }
    .sheet-label { margin-bottom: 4px; color: #999; font-size: 10px; font-weight: 750;
      letter-spacing: 0.08em; text-transform: uppercase; }
    .sheet-example { padding: 5px 0; }
    .sheet-example + .sheet-example { border-top: 1px dashed #efe9dd; }
    .sheet-ex-zh { font-size: 17px;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .sheet-ex-zh .hl { color: #b5232b; font-weight: 700; }
    .sheet-ex-py { color: #999; font-size: 12px; }
    .sheet-ex-en { color: #666; font-size: 13px; }
    .sheet-char-row { display: grid; grid-template-columns: auto 1fr auto;
      align-items: center; gap: 4px 9px; padding: 6px 0; }
    .sheet-char-word { color: #8f1c23; font-size: 22px; font-weight: 700;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .sheet-char-info { min-width: 0; }
    .sheet-char-pinyin { display: block; color: #555; font-size: 13px; font-weight: 650; }
    .sheet-char-def { color: #666; font-size: 12px; }
    .sheet-related-row { padding: 6px 0; }
    .sheet-related-row + .sheet-related-row { border-top: 1px dashed #efe9dd; }
    .sheet-related-word { color: #8f1c23; font-size: 19px; font-weight: 700;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    .sheet-related-reason { margin-left: auto; padding: 1px 7px; border-radius: 8px;
      background: #f1ead9; color: #8a7a58; font-size: 11px; font-weight: 600; }

    /* settings */
    .settings h2 { font-size: 16px; margin: 18px 0 6px; }
    .settings .note { color: #777; font-size: 12.5px; }
    .settings .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    .token-input { width: 100%; padding: 9px 12px; font-size: 15px; border: 1px solid #ddd;
      border-radius: 9px; margin: 8px 0; background: #fff; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <header>
    <h1>中 Zhongwen Flashcards</h1>
    <span id="dueBadge" hidden></span>
  </header>
  <nav>
    <button data-tab="review" class="active">Review</button>
    <button data-tab="words">Words</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <main id="view"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
